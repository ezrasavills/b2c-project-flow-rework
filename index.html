body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(1200px 600px at 50% 40%,rgba(0,0,0,.05),rgba(0,0,0,.35))}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
select option{background:#1b1d23;color:#F2F4F8}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::selection{background:rgba(245,196,0,.35)}

/* ---------- Liquid glass primitives ---------- */
.glass,.card{position:relative;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:var(--glassB);box-shadow:var(--glassSh)}
.glass::before,.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,0) 38%),radial-gradient(90% 55% at 12% 0%,rgba(255,255,255,.10),transparent 60%)}
.card{border-radius:var(--r)}
.card>*{position:relative}

/* ---------- Top nav ---------- */
.navwrap{position:sticky;top:0;z-index:50;padding:16px 28px 0}
.topnav{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:20px}
.topnav>*{position:relative}
.brand{display:flex;align-items:center;gap:11px;padding-right:12px;margin-right:2px;border-right:1px solid var(--line)}
.mark{width:40px;height:40px;border-radius:11px;background:#F5C400;display:grid;place-items:center;color:#121316;font-weight:800;font-size:12px;box-shadow:none}
.brand b{display:block;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:9.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.tabs{display:flex;gap:3px;padding:4px;border-radius:14px;background:rgba(0,0,0,.22);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.tab{border:0;background:none;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;color:#AEB5C2;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:.18s}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab.on{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px rgba(0,0,0,.35)}
.tab svg{width:15px;height:15px}
.tab .ct{font-size:10.5px;background:rgba(255,255,255,.1);padding:1px 8px;border-radius:20px;color:var(--ink2)}
.tab .car{width:10px;height:10px;opacity:.6}
.sp{flex:1}
.gin{height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.22);box-shadow:inset 0 1px 3px rgba(0,0,0,.3);outline:none;padding:0 14px;transition:.15s;color:var(--ink)}
.gin::placeholder{color:#7D8595}
.gin:focus{border-color:rgba(245,196,0,.55);box-shadow:0 0 0 4px rgba(245,196,0,.14)}
.search{position:relative}
.search input{width:230px;padding-left:38px}
.search svg{position:absolute;left:14px;top:12px;width:16px;height:16px;color:var(--muted)}
.gbtn{height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);padding:0 15px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.14);transition:.15s}
.gbtn:hover{background:rgba(255,255,255,.14)}
.gbtn svg{width:15px;height:15px}
.gbtn.prim{background:#F5C400;color:#15161A;border-color:#F5C400;box-shadow:none}
.gbtn.prim:hover{background:#FFD21F;border-color:#FFD21F}
.gbtn.prim b{font-size:18px;line-height:1}
.gbtn .pc{display:flex}
.gbtn .pc span{width:22px;height:22px;border-radius:50%;font-size:8px;font-weight:700;color:#fff;display:grid;place-items:center;margin-left:-6px;border:1.5px solid rgba(20,21,26,.9)}
.gbtn .pc span:first-child{margin-left:0}
.sync{height:40px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);white-space:nowrap;max-width:240px;color:var(--ink)}
.sync span{overflow:hidden;text-overflow:ellipsis}
.sync i{width:8px;height:8px;border-radius:50%;flex:none}
.sync.ok i{background:var(--green);box-shadow:0 0 0 3px rgba(61,220,151,.2),0 0 10px var(--green)}
.sync.warn i{background:var(--amber);box-shadow:0 0 0 3px rgba(242,176,74,.22)}
.sync.err i{background:var(--red);box-shadow:0 0 0 3px rgba(255,107,107,.2)}
.sync.off i{background:#6A7180}
.sync.busy i{background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* popovers */
.pop{position:absolute;top:calc(100% + 12px);min-width:260px;border-radius:16px;padding:10px;z-index:60;opacity:0;pointer-events:none;transform:translateY(-6px) scale(.98);transform-origin:top;transition:.16s;
 background:linear-gradient(150deg,rgba(40,43,52,.94),rgba(24,26,32,.95));-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
 border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 26px 60px rgba(0,0,0,.6)}
.pop.on{opacity:1;pointer-events:auto;transform:none}
.pop.r{right:0}
.pop h6{margin:6px 10px 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:500;font-size:13px;border:0;background:none;width:100%;text-align:left;color:var(--ink)}
.pi:hover{background:rgba(255,255,255,.08)}
.pi .dot{width:10px;height:10px;border-radius:50%;flex:none}
.pi .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .ct{font-size:11px;color:var(--muted)}
.pi .ct.hot{color:var(--red);font-weight:600}
.pi svg{width:16px;height:16px;color:var(--muted);flex:none}
.pi.add{color:var(--gold2);font-weight:600}
.pi.danger{color:var(--red)}
.psep{height:1px;background:var(--line);margin:6px 8px}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:4px 6px 6px}
.pchip{min-width:0;display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:12px;font-weight:600;cursor:pointer;user-select:none}
.pchip:hover{background:rgba(255,255,255,.1)}
.pchip span{width:16px;height:16px;border-radius:50%;flex:none}
.pchip.on{background:var(--gold);color:#15161A;border-color:var(--gold)}
.pchip>b{min-width:0;flex:1}
.pchip small{margin-left:auto;font-weight:500;opacity:.6;font-size:10.5px}
.pfoot{display:flex;align-items:center;gap:8px;padding:10px 8px 4px;border-top:1px solid var(--line);margin-top:6px}

/* ---------- Page ---------- */
.wrap{padding:24px 28px 120px;max-width:1720px;margin:0 auto}
.phead{display:flex;align-items:flex-end;gap:14px;margin:8px 6px 20px}
.phead h1{margin:0;font-size:28px;letter-spacing:-.035em;font-weight:700}
.phead .sub{color:var(--ink2);opacity:.8;font-size:13px;margin-top:5px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.fchip{display:inline-flex;align-items:center;gap:6px;background:rgba(245,196,0,.18);border:1px solid rgba(245,196,0,.4);color:var(--gold2);border-radius:12px;padding:5px 6px 5px 12px;font-size:12px;font-weight:600}
.fchip.note{background:rgba(255,255,255,.07);border-color:var(--line);color:var(--ink2);padding-right:12px}
.fchip button{border:0;background:rgba(255,255,255,.14);color:#fff;width:18px;height:18px;border-radius:50%;font-size:12px;line-height:1;padding:0}
.pad{padding:22px 24px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.ch h3{margin:0;font-size:15px;letter-spacing:-.015em;font-weight:700}
.ch .h{font-size:12px;color:var(--muted);margin-top:3px}
.link{color:var(--gold2);font-weight:600;font-size:12.5px;cursor:pointer;background:none;border:0}
.g{display:grid;gap:20px}
.btn{height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);padding:0 18px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.15s;color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.btn:hover{background:rgba(255,255,255,.14)}
.btn{white-space:nowrap}.btn svg{width:16px;height:16px;flex:none}
.btn.gold{background:#F5C400;color:#15161A;border:0;box-shadow:none}
.btn.gold:hover{background:#FFD21F}
.btn.green{background:linear-gradient(180deg,#5BE8AA,#2DBE7E);color:#06281A;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px rgba(61,220,151,.25)}
.btn.danger{color:var(--red)}
.btn.sm{height:34px;padding:0 14px;font-size:12.5px}
.hero{border-radius:22px;padding:30px 34px;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(245,196,0,.22),transparent 65%);pointer-events:none}
.hero h2{margin:0 0 10px;font-size:26px;letter-spacing:-.035em;font-weight:700}
.hero p{margin:0;color:var(--ink2);font-size:14.5px;max-width:860px;line-height:1.7}
.hero p b{color:#fff}.hero p b.r{color:var(--red)}.hero p b.y{color:var(--gold2)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.kpi{padding:20px 22px;cursor:pointer;transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-3px)}
.kpi .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;margin-bottom:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.kpi .ic svg{width:19px;height:19px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-size:34px;font-weight:700;letter-spacing:-.04em;margin-top:3px;line-height:1.1}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:5px}

<script>
/* =====================================================================
   SETTINGS – the only part you need to edit (see the setup guide)
   ===================================================================== */
const CONFIG={
 clientId:"dc04bc1c-adff-4aa0-b5c1-d17521baa118",   // from the Entra app registration "Overview" page
 tenantId:"97852f08-acc2-46c3-a799-2a2015d8da45",      // from the same page
 siteHost:"savillsglobal.sharepoint.com",
 sitePath:"/sites/UKResidentialResearchsharedadminfiles",
 tasksList:"B2C Project Flow Tasks",
 sectionsList:"B2C Project Flow Sections",
 peopleList:"B2C Project Flow People",            // maps initials to Microsoft accounts
 pollSeconds:20                                   // how often everyone's screen refreshes
};
const KEY="b2c_project_flow_v3";
const DEFAULT_SECTIONS=["Prime Index","Publications","Business Intelligence","Market Share/Growth Plans","Lettings Market Share","Press","Data Visualisation","Ad hoc Requests","Presentations, Webinars & Filming","Longer Term"];
const PALETTE=["#F5C400","#6E9BFF","#3DDC97","#FF8A7A","#A78BFA","#38D3E6","#F2A93B","#F472B6","#94A3B8","#6EE7A8","#E08A5B","#7C9CFF"];
const PCOL=["#4F7BEA","#22A877","#C49A2C","#8A6CEB","#E0685B","#1BA9BC","#D24B91","#64748B","#DD8A12","#3C9E50"];
const STATUSES=["Not started","In progress","Complete","On hold"];
const PRIS=["High","Medium","Low"];
const PCH={"High":"#FF6B6B","Medium":"#F2B04A","Low":"#7FA3D9"};
const PRANK={"High":0,"Medium":1,"Low":2};
const SCH={"Complete":"#3DDC97","In progress":"#6E9BFF","Not started":"#9AA3B2","On hold":"#F2B04A"};
const DAY=864e5;
const T=new Date();T.setHours(0,0,0,0);
const $=id=>document.getElementById(id);
const H=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const D=s=>s?new Date(s+"T00:00:00"):null;
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=(s,y)=>s?D(s).toLocaleDateString("en-GB",y?{day:"numeric",month:"short",year:"numeric"}:{day:"numeric",month:"short"}):"";
const ico={
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
 alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
 users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.6a3.5 3.5 0 010 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>',
 xls:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 8l8 8M16 8l-8 8"/></svg>',
 link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
 dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
 ul:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg>',
 refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg>',
 flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
 sel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2.5"/><rect x="13" y="13" width="8" height="8" rx="2.5"/><path d="M15 6l2 2 4-4"/></svg>'
};
const doneBtn=(t,sm)=>`<button class="done-btn ${sm?"sm":""} ${t.status==="Complete"?"on":""}" data-done="${t.id}" title="${t.status==="Complete"?"Completed – click to reopen":"Mark complete"}">${ico.check}</button>`;

/* ---------- People ---------- */
const splitPeople=s=>Array.isArray(s)?s:String(s||"").split(/[\/,&;+]| and /i).map(x=>x.trim().replace(/\?$/,"")).filter(Boolean);
const uniq=a=>{const seen=new Set();return a.filter(x=>{const k=x.toLowerCase();if(seen.has(k))return false;seen.add(k);return true})};
const people=t=>uniq([...t.pm,...t.an]).filter(x=>x!=="TBC");
function allPeople(){const c={};DB.tasks.forEach(t=>people(t).forEach(p=>c[p]=(c[p]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1])}
function canon(p){const hit=allPeople().find(([x])=>x.toLowerCase()===p.toLowerCase());return hit?hit[0]:p}
function pColor(p){let h=0;for(const ch of p)h=(h*31+ch.charCodeAt(0))>>>0;return PCOL[h%PCOL.length]}
const avatars=(t,max=4)=>{const pmset=new Set(t.pm),ps=people(t);return'<span class="av">'+ps.slice(0,max).map(p=>`<span class="${pmset.has(p)?"pm":""}" style="background:${pColor(p)};font-size:${p.length>2?8:9}px" title="${H(p)}${(pInfo(p)||{}).name?" – "+H(pInfo(p).name):""}${pmset.has(p)?" (project manager)":""}">${H(p.slice(0,3))}</span>`).join("")+(ps.length>max?`<em>+${ps.length-max}</em>`:"")+"</span>"};

/* ---------- State ---------- */

function norm(t){t.pm=uniq(splitPeople(t.pm));t.an=uniq(splitPeople(t.an));t.prog=Math.max(0,Math.min(1,+t.prog||0));if(!STATUSES.includes(t.status))t.status=t.prog>=1?"Complete":t.prog>0?"In progress":"Not started";t.notes=t.notes||"";{const p=String(t.pri||"").trim().toLowerCase();t.pri=PRIS.find(x=>x.toLowerCase()===p)||(p==="med"?"Medium":"Medium")}return t}

const isOver=t=>isOpen(t)&&t.status!=="On hold"&&t.end&&D(t.end)<T;
const isSoon=t=>isOpen(t)&&t.status!=="On hold"&&t.end&&daysLeft(t)>=0&&daysLeft(t)<=14;
const URGENT_DAYS=14;
const quadOf=t=>{if(!isOpen(t)||t.status==="On hold"||!t.end)return null;const u=daysLeft(t)<=URGENT_DAYS,i=t.pri==="High";return i&&u?"do":i?"plan":u?"fit":"later"};
const QUADS={do:{n:"Do now",d:"High priority · due within 14 days or overdue",c:"#FF6B6B"},plan:{n:"Plan",d:"High priority · deadline further out",c:"#F5C400"},fit:{n:"Fit in",d:"Medium/low priority · due soon",c:"#6E9BFF"},later:{n:"Later",d:"Medium/low priority · deadline further out",c:"#8B93A3"}};
const priPill=p=>`<span class="ppill" style="--pc:${PCH[p]}"><i></i>${p}</span>`;
function dueChip(t){
 if(t.status==="Complete")return'<span class="due g">Done</span>';
 if(t.status==="On hold")return'<span class="due m">On hold</span>';
 const d=daysLeft(t);if(d===null)return'<span class="due m">No end date</span>';
 if(d<0)return`<span class="due r">${-d}d overdue</span>`;
 if(d===0)return'<span class="due a">Due today</span>';

}
const pillCls=s=>"p-"+s.split(" ")[0];
function matchPeople(t){if(!UI.people.length)return true;const ps=people(t).map(x=>x.toLowerCase()),sel=UI.people.map(x=>x.toLowerCase());return UI.pmode==="all"?sel.every(p=>ps.includes(p)):sel.some(p=>ps.includes(p))}
const TLS=[["over","Overdue",isOver],["soon","Due in next 14 days",isSoon],["later","Due later",t=>isOpen(t)&&t.status!=="On hold"&&t.end&&daysLeft(t)>14],["nodate","No end date",t=>!t.end],["donem","Completed this month",t=>t.status==="Complete"&&t.end&&D(t.end).getMonth()===T.getMonth()&&D(t.end).getFullYear()===T.getFullYear()]];
const TLF=Object.fromEntries(TLS.map(x=>[x[0],x[2]]));const TLN=Object.fromEntries(TLS.map(x=>[x[0],x[1]]));
function matches(t,ex){const q=UI.q.toLowerCase();return(!q||(t.task+" "+t.pm.join(" ")+" "+t.an.join(" ")+" "+t.ws+" "+t.notes).toLowerCase().includes(q))&&matchPeople(t)&&(ex==="st"||!UI.statuses.size||UI.statuses.has(t.status))&&(ex==="sec"||!UI.sections.size||UI.sections.has(t.ws))&&(ex==="pri"||!UI.pris.size||UI.pris.has(t.pri))&&(ex==="tl"||!UI.tls.size||[...UI.tls].some(k=>TLF[k](t)))}
const setOne=k=>{UI.filters=new Set([k]);UI.statuses.clear();UI.tls.clear();UI.quad=null;UI.showDone=false;
 if(k==="all")UI.showDone=true;
 else if(STATUSES.includes(k)){UI.statuses.add(k);if(k==="Complete")UI.showDone=true}

 else if(k==="high")UI.pris=new Set(["High"]);

function ring(pct,size,stroke,color,track){const r=(size-stroke)/2,c=2*Math.PI*r;
 return`<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="filter:drop-shadow(0 0 6px ${color}55)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c*pct} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" ${size>80?'style="font-size:15px"':""}>${Math.round(pct*100)}%</text></svg>`}
const short=s=>s.length>40?s.slice(0,38)+"…":s;

/* ---------- Completing tasks ---------- */
function setProg(t,p){t.prog=Math.max(0,Math.min(1,p));if(t.prog>=1)t.status="Complete";else if(t.status==="Complete")t.status=t.prog>0?"In progress":"Not started";else if(t.prog>0&&t.status==="Not started")t.status="In progress"}
function setStatus(t,s){t.status=s;if(s==="Complete")t.prog=1;else if(t.prog>=1)t.prog=.9;if(s==="Not started")t.prog=0}
function toggleDone(id,el){
 const t=DB.tasks.find(x=>x.id===id);if(!t)return;
 const bak={status:t.status,prog:t.prog,updated:t.updated};
 const undo=()=>{Object.assign(t,bak);save("Undone");render()};
 if(t.status==="Complete"){setStatus(t,bak.prog>0&&bak.prog<1?"In progress":"In progress");touch(t);save("Reopened “"+short(t.task)+"”",undo);render();return}
 setStatus(t,"Complete");touch(t);
 if(el){el.classList.add("on","pop-anim");const row=el.closest(".tr,.mrow,.grow2");if(row){row.classList.add("flash","leaving")}}
 save("✓ “"+short(t.task)+"” completed",undo);
 setTimeout(render,el?650:0);
}
function bulkComplete(){
 const ids=[...UI.sel];const baks=ids.map(id=>{const t=DB.tasks.find(x=>x.id===id);return[t,{status:t.status,prog:t.prog,updated:t.updated}]});
 baks.forEach(([t])=>{setStatus(t,"Complete");touch(t)});
 UI.sel.clear();UI.selMode=false;
 save(`✓ ${ids.length} task${ids.length===1?"":"s"} marked complete`,()=>{baks.forEach(([t,b])=>Object.assign(t,b));save("Undone");render()});render();
}
function bulkStatus(s){const ids=[...UI.sel];ids.forEach(id=>{const t=DB.tasks.find(x=>x.id===id);setStatus(t,s);touch(t)});UI.sel.clear();UI.selMode=false;save(`${ids.length} task(s) set to ${s}`);render()}

function ddBar(scope,opt={}){

  ${n?`<div class="pfoot"><span class="sp"></span><button class="link" data-ddclr="${key}">Clear</button></div>`:""}</div></span>`};
 const ps=pool("st"),pp=pool("pri"),pc=pool("sec"),pt=pool("tl");

const pInfo=ini=>peopleMap().find(p=>p.ini.toLowerCase()===String(ini).toLowerCase());
function myIni(){const e=(Live.email||"").toLowerCase();if(!e)return null;const p=peopleMap().find(x=>(x.email||"").toLowerCase()===e);return p?p.ini:null}
const isMine=(t,ini,role)=>{const L=x=>x.toLowerCase(),m=L(ini);return(role!=="an"&&t.pm.some(p=>L(p)===m))||(role!=="pm"&&t.an.some(p=>L(p)===m))};
async function savePeopleRows(rows){
 // one person per account: if an email is being assigned, clear it from any other initials
 const all=new Map(peopleMap().map(p=>[p.ini.toLowerCase(),{...p}]));
 rows.forEach(r=>{const e=(r.email||"").toLowerCase();if(e)all.forEach((p,k)=>{if(k!==r.ini.toLowerCase()&&(p.email||"").toLowerCase()===e){p.email="";rows.push({ini:p.ini,email:"",name:p.name})}});all.set(r.ini.toLowerCase(),{...all.get(r.ini.toLowerCase()),...r})});
 const uniqRows=[...new Map(rows.map(r=>[r.ini.toLowerCase(),r])).values()];
 if(Live.hasPeople)await Live.savePeople(uniqRows);
 else localStorage.setItem(PKEY,JSON.stringify([...all.values()].filter(p=>p.email||p.name)));
}
async function claimInitials(ini){
 ini=canon(ini.trim());if(!ini)return;
 try{await savePeopleRows([{ini,email:Live.email,name:Live.me}]);toast(`You're now linked to ${ini}`);render()}catch(e){toast("Couldn't save: "+e.message)}
}

/* ---------- Multi-person input ---------- */
function chipInput(host,initial,onChange){
 let vals=[...initial];
 const draw=()=>{
  const sug=allPeople().map(x=>x[0]).filter(p=>!vals.some(v=>v.toLowerCase()===p.toLowerCase())).slice(0,14);
  host.innerHTML=`<div class="chipin">${vals.map((p,i)=>`<span class="pchp"><i style="background:${pColor(p)}">${H(p.slice(0,3))}</i>${H(p)}<button type="button" data-i="${i}" title="Remove">×</button></span>`).join("")}<input list="plist" placeholder="${vals.length?"Add another…":"Type initials, press Enter"}"></div><div class="sugg">${sug.map(p=>`<button type="button" data-p="${H(p)}">+ ${H(p)}</button>`).join("")}</div>`;
  const inp=host.querySelector("input");
  host.querySelector(".chipin").onclick=e=>{if(e.target===e.currentTarget)inp.focus()};
  const add=raw=>{const ps=splitPeople(raw).map(canon);let ch=false;ps.forEach(p=>{if(!vals.some(v=>v.toLowerCase()===p.toLowerCase())){vals.push(p);ch=true}});if(ch){onChange(vals);draw();host.querySelector("input").focus()}};
  inp.onkeydown=e=>{if((e.key==="Enter"||e.key===","||e.key==="/"||e.key==="Tab")&&inp.value.trim()){e.preventDefault();add(inp.value)}
   else if(e.key==="Backspace"&&!inp.value&&vals.length){vals.pop();onChange(vals);draw();host.querySelector("input").focus()}};
  inp.oninput=()=>{if(allPeople().some(([p])=>p===inp.value))add(inp.value)};
  inp.onblur=()=>{if(inp.value.trim())add(inp.value)};
  host.querySelectorAll(".pchp button").forEach(b=>b.onclick=()=>{vals.splice(+b.dataset.i,1);onChange(vals);draw()});
  host.querySelectorAll(".sugg button").forEach(b=>b.onclick=()=>add(b.dataset.p));
 };
 draw();
}

  await api(`/sites/${siteId}/lists/${taskListId}/columns`,{method:"POST",body:JSON.stringify({name:"Priority",displayName:"Priority",choice:{choices:PRIS,displayAs:"dropDownMenu"},defaultValue:{value:"Medium"}})},["Sites.Manage.All"]);
  await checkPri();if(!hasPri)throw new Error("Column not found after creating it");
  const keep=new Map(DB.tasks.filter(t=>t.sp).map(t=>[t.sp,t.pri]));await connect();
  DB.tasks.forEach(t=>{const p=keep.get(t.sp);if(p&&p!==t.pri)t.pri=p});push()}
 async function createPeopleList(){
  await api(`/sites/${siteId}/lists`,{method:"POST",body:JSON.stringify({displayName:CONFIG.peopleList,list:{template:"genericList"},columns:[{name:"Email",text:{}},{name:"DisplayName",text:{}}]})},["Sites.Manage.All"]);
  await findLists();if(!peopleListId)throw new Error("List not found after creating it");DB.people=[];await pull()}
 async function savePeople(rows){ // rows: [{ini,email,name}]
  const PU=`/sites/${siteId}/lists/${peopleListId}/items`,reqs=[];
  for(const r of rows){const ex=DB.people.find(p=>p.ini.toLowerCase()===r.ini.toLowerCase());const f={Title:r.ini,Email:r.email||"",DisplayName:r.name||""};
   if(ex){if(ex.email!==f.Email||ex.name!==f.DisplayName)reqs.push({method:"PATCH",url:`${PU}/${ex.sp}/fields`,body:f})}
   else if(f.Email||f.DisplayName)reqs.push({method:"POST",url:PU,body:{fields:f}})}
  if(reqs.length)await batch(reqs);
  const pi=await getAll(peopleListId,"Title,Email,DisplayName");
  DB.people=pi.map(it=>({sp:String(it.id),ini:(it.fields.Title||"").trim(),email:(it.fields.Email||"").trim(),name:(it.fields.DisplayName||"").trim()})).filter(p=>p.ini)}
 async function createLists(){
  const sc=["Sites.Manage.All"];
  const mk=(name,cols)=>api(`/sites/${siteId}/lists`,{method:"POST",body:JSON.stringify({displayName:name,list:{template:"genericList"},columns:cols})},sc);
  if(!taskListId)await mk(CONFIG.tasksList,[{name:"Section",text:{}},{name:"ProjectManagers",text:{}},{name:"Analysts",text:{}},{name:"Progress",number:{}},
   {name:"Status",choice:{choices:STATUSES,displayAs:"dropDownMenu"}},{name:"StartDate",dateTime:{format:"dateOnly"}},{name:"EndDate",dateTime:{format:"dateOnly"}},
   {name:"Notes",text:{allowMultipleLines:true,linesForEditing:6}},{name:"Priority",choice:{choices:PRIS,displayAs:"dropDownMenu"},defaultValue:{value:"Medium"}}]);
  if(!secListId)await mk(CONFIG.sectionsList,[{name:"Color",text:{}},{name:"SortOrder",number:{}}]);
  if(!peopleListId)await mk(CONFIG.peopleList,[{name:"Email",text:{}},{name:"DisplayName",text:{}}]).catch(()=>{});
  await findLists();await connect()}
 async function startFresh(){DB.sections=DEFAULT_SECTIONS.map((n,i)=>({name:n,color:PALETTE[i%PALETTE.length],order:i+1}));set("ready");render();await push()}
 async function importWorkbook(file){
  const d=await XL.parse(await file.arrayBuffer());
  if(!confirm(`Add ${d.tasks.length.toLocaleString("en-GB")} tasks from ${file.name} to the shared SharePoint list?`+(DB.tasks.length?`\n\nThe list already has ${DB.tasks.length.toLocaleString("en-GB")} tasks – these will be added on top, not replaced.`:"")))return;
  let mx=Math.max(0,...DB.sections.map(s=>s.order||0));
  d.sections.forEach(s=>{if(!DB.sections.some(x=>x.name.toLowerCase()===s.name.toLowerCase()))DB.sections.push({name:s.name,color:s.color,order:++mx})});
  const base=-Date.now();d.tasks.forEach((t,i)=>{delete t.sp;t.id=base-i;DB.tasks.push(t)});
  set("ready");go("overview");toast("Uploading to SharePoint – keep this tab open until it finishes");await push();
  if(state==="ready")toast(`Imported ${d.tasks.length.toLocaleString("en-GB")} tasks – everyone can see them now`)}
 return{get hasPeople(){return!!peopleListId},get email(){return MOCK?"test.user@savills.com":(account&&account.username)||""},createPeopleList,savePeople,get hasPri(){return hasPri},addPriColumn,init,pull,push,signIn,signOut,createLists,startFresh,importWorkbook,configured,
  schedule(){clearTimeout(timer);timer=setTimeout(push,400)},
   pending:()=>pushing||DB.tasks.some(t=>!t.sp||!snapT.has(t.sp)||ser(t)!==snapT.get(t.sp)),
  get state(){return state},get msg(){return msg},get me(){return me},get lastPull(){return lastPull},get listUrl(){return listUrl},get account(){return account}}
})();

function renderSyncPop(){

 const head=`<h6>Shared data · SharePoint</h6><div style="padding:2px 12px 10px;font-size:12.5px;line-height:1.6">

  <span style="color:${ok?"var(--green)":st==="err"?"var(--red)":"var(--amber)"}">${ok?"Live – changes save instantly for everyone":st==="busy"?"Saving…":H(Live.msg||"Not connected")}</span>
  ${Live.lastPull?`<br><span style="color:var(--muted)">Last refreshed ${new Date(Live.lastPull).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})} · updates every ${CONFIG.pollSeconds}s</span>`:""}</div>
  ${ok?`<button class="pi" id="sRef">${ico.refresh}<span class="nm">Refresh now</span></button>`:""}

 $("syncPop").innerHTML=head+`<div class="psep"></div><h6>Export & import</h6>

 const on=(id,f)=>{const el=$(id);if(el)el.onclick=()=>{closePops();f()}};
 on("sRef",async()=>{await Live.pull();toast("Refreshed")});on("sOpen",()=>window.open(Live.listUrl,"_blank"));
 on("sXlsx",()=>{dl(`B2C_Project_Flow_Backup_${iso(T)}.xlsx`,XL.build(DB));toast("Backup downloaded")});
 on("sCsv",exportCsv);on("sImp",()=>$("file").click());on("sOut",()=>Live.signOut());on("sTeam",()=>peopleModal());
}
function dl(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
const ukd=s=>s?s.split("-").reverse().join("/"):"";
function exportCsv(){const e=v=>`"${String(v??"").replace(/"/g,'""')}"`;
 const L=[["Section","Task","Project manager(s)","Analyst(s)","Progress","Status","Priority","Start","End","Notes"].join(",")];
 DB.sections.forEach(s=>DB.tasks.filter(t=>t.ws===s.name).forEach(t=>L.push([s.name,t.task,t.pm.join("/"),t.an.join("/"),Math.round(t.prog*100)+"%",t.status,t.pri,ukd(t.start),ukd(t.end),t.notes].map(e).join(","))));
 dl(`B2C_Project_Flow_${iso(T)}.csv`,new Blob(["\ufeff"+L.join("\r\n")],{type:"text/csv"}));toast("Exported "+DB.tasks.length+" tasks")}
$("file").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{await Live.importWorkbook(f)}catch(x){toast("Couldn't import: "+x.message)}};
addEventListener("beforeunload",e=>{if(Live.pending()){e.preventDefault();e.returnValue=""}});

/* ---------- Global ---------- */
$("q").oninput=e=>{UI.q=e.target.value;UI.limit=80;if(UI.view==="overview"&&UI.q){UI.view="all";setOne("all")}render();$("q").focus()};
$("newTask").onclick=()=>openTask(null);
$("scrim").onclick=()=>{$("modal").classList.remove("on");closeDrawer();$("scrim").classList.remove("on")};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePops();$("scrim").click();if(UI.selMode){UI.selMode=false;UI.sel.clear();render()}}
 const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
 if(e.key==="n"&&!typing&&!$("drawer").classList.contains("on")){e.preventDefault();openTask(null)}
 if(e.key==="/"&&!typing){e.preventDefault();$("q").focus()}});
window.addEventListener("focus",()=>Live.pull());
document.addEventListener("visibilitychange",()=>{if(!document.hidden)Live.pull()});
DB=blank();Live.init();
</script>
